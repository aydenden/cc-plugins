name: Publish Plugins

on:
  push:
    branches: [main, master]
    paths:
      - "plugins/*/package.json"
  workflow_dispatch:
    inputs:
      plugin:
        description: "Plugin to publish"
        required: true
        type: choice
        options:
          - obsidian-knowledge

permissions:
  contents: read

jobs:
  detect:
    name: Detect version bumps
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.detect.outputs.plugins }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed plugins with version bump
        id: detect
        run: |
          PLUGINS="[]"
          for pkg in plugins/*/package.json; do
            [ -f "$pkg" ] || continue
            plugin=$(basename "$(dirname "$pkg")")
            OLD=$(git show "HEAD~1:$pkg" 2>/dev/null | jq -r '.version // empty' 2>/dev/null || echo "")
            NEW=$(jq -r '.version' "$pkg")
            if [ -z "$OLD" ]; then
              echo "$plugin: no previous version (new package or force push) — skipping"
              continue
            fi
            if [ "$OLD" != "$NEW" ]; then
              PLUGINS=$(echo "$PLUGINS" | jq --arg p "$plugin" '. + [$p]')
              echo "$plugin: $OLD → $NEW (will publish)"
            else
              echo "$plugin: $NEW (no version change — skipping)"
            fi
          done
          echo "plugins=$PLUGINS" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.plugin }}
    needs: detect
    if: needs.detect.outputs.plugins != '[]'
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.detect.outputs.plugins) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd "plugins/${{ matrix.plugin }}"
          npm publish --access public

  publish-manual:
    name: Publish ${{ inputs.plugin }} (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd "plugins/${{ inputs.plugin }}"
          npm publish --access public
